<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Veg Recipe Finder</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f9f9f9, #e0f7fa);
      padding: 40px;
      margin: 0;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 30px;
      color: #388e3c;
    }

    .search-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    input, select, button {
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #bbb;
      outline: none;
      transition: box-shadow 0.2s ease;
    }

    input:focus, select:focus {
      box-shadow: 0 0 8px rgba(56, 142, 60, 0.4);
      border-color: #388e3c;
    }

    button {
      background-color: #388e3c;
      color: white;
      cursor: pointer;
      border: none;
    }

    button:hover {
      background-color: #2e7d32;
    }

    #recipe-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
      padding: 0 20px;
    }

    .recipe {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .recipe:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
    }

    .recipe h3 {
      margin-top: 0;
      color: #388e3c;
    }

    .recipe p {
      margin: 8px 0;
    }

    @media (max-width: 600px) {
      input, select, button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <h1>🥦 Pure Veg Recipe Finder</h1>

  <div class="search-container">
    <input type="text" id="ingredient-input" placeholder="Enter ingredients (e.g., paneer, tomato)">
    <select id="type-filter">
      <option value="All">All</option>
      <option value="Breakfast">Breakfast</option>
      <option value="Lunch">Lunch</option>
      <option value="Dinner">Dinner</option>
    </select>
    <button id="search-button">Search</button>
  </div>

  <div id="recipe-list"></div>

  <script>
    const recipes = [
      {
        name: "Paneer Bhurji",
        ingredients: ["paneer", "onion", "tomato", "spices"],
        type: "Lunch"
      },
      {
        name: "Vegetable Sandwich",
        ingredients: ["bread", "cucumber", "tomato", "butter"],
        type: "Breakfast"
      },
      {
        name: "Aloo Paratha",
        ingredients: ["wheat flour", "potato", "spices", "ghee"],
        type: "Breakfast"
      },
      {
        name: "Palak Paneer",
        ingredients: ["spinach", "paneer", "cream", "spices"],
        type: "Dinner"
      },
      {
        name: "Veg Biryani",
        ingredients: ["rice", "vegetables", "spices", "yogurt"],
        type: "Dinner"
      }
    ];

    const ingredientInput = document.getElementById("ingredient-input");
    const typeFilter = document.getElementById("type-filter");
    const searchButton = document.getElementById("search-button");
    const recipeList = document.getElementById("recipe-list");

    function renderRecipes(filteredRecipes) {
      recipeList.innerHTML = "";
      if (filteredRecipes.length === 0) {
        recipeList.innerHTML = "<p>No recipes found.</p>";
        return;
      }

      filteredRecipes.forEach(recipe => {
        const div = document.createElement("div");
        div.className = "recipe";
        div.innerHTML = `
          <h3>${recipe.name}</h3>
          <p><strong>Type:</strong> ${recipe.type}</p>
          <p><strong>Ingredients:</strong> ${recipe.ingredients.join(", ")}</p>
        `;
        recipeList.appendChild(div);
      });
    }

    function filterRecipes() {
      const searchInput = ingredientInput.value.toLowerCase().trim();
      const selectedType = typeFilter.value;

      const searchIngredients = searchInput
        .split(",")
        .map(str => str.trim())
        .filter(str => str);

      const filtered = recipes.filter(recipe => {
        const matchesIngredients =
          searchIngredients.length === 0 ||
          searchIngredients.every(ing =>
            recipe.ingredients.map(i => i.toLowerCase()).includes(ing)
          );

        const matchesType = selectedType === "All" || recipe.type === selectedType;

        return matchesIngredients && matchesType;
      });

      renderRecipes(filtered);
    }

    // Event: Press Enter key
    ingredientInput.addEventListener("keyup", event => {
      if (event.key === "Enter") {
        filterRecipes();
      }
    });

    // Event: Click Search button
    searchButton.addEventListener("click", filterRecipes);

    // Event: Change dropdown
    typeFilter.addEventListener("change", filterRecipes);

    // Initial load
    renderRecipes(recipes);
  </script>
</body>
</html>
